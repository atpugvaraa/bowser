<!doctype html><meta charset=utf-8><title>power-gl</title><body style="margin:0;background:#000"><canvas id=c width=1280 height=720 style="width:100vw;height:100vh"></canvas>
<script>
// Continuous, fixed-cost WebGL2 workload with an fps beacon (posts the last 5 s fps to /result?name=<hash>). Localhost only.
const gl = document.getElementById('c').getContext('webgl2'), name = (location.hash || '#x').slice(1);
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 q; void main(){ gl_Position = vec4(q,0,1); }'));
gl.attachShader(p, sh(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float; uniform float t; out vec4 o; void main(){ vec2 u = gl_FragCoord.xy/700.0; float a=0.0; for(int i=0;i<60;i++){ a += sin(u.x*float(i)+t)*cos(u.y*float(i)-t);} o = vec4(.5+.5*sin(a), .5+.5*cos(a), .3, 1.); }'));
gl.linkProgram(p); gl.useProgram(p); const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const l = gl.getAttribLocation(p, 'q'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0); const tu = gl.getUniformLocation(p, 't');
let n = 0, t0 = performance.now(), best = 0;
(function f(){ gl.uniform1f(tu, performance.now() / 1000); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); n++; const now = performance.now();
  if (now - t0 >= 5000) { best = Math.round(n * 1000 / (now - t0)); fetch('/result?name=' + name, { method: 'POST', body: JSON.stringify({ fps: best, visible: document.visibilityState, t: Date.now() }) }).catch(() => {}); n = 0; t0 = now; }
  requestAnimationFrame(f); })();
</script>
