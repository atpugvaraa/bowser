<!doctype html><meta charset=utf-8><body><canvas id=c width=64 height=64></canvas><audio id=a loop></audio><video id=v muted playsinline></video><video id=v2 playsinline></video><script>
// quiet 440 Hz tone as WAV blob (volume 0.02)
function wav(){const sr=8000,n=sr*2,b=new DataView(new ArrayBuffer(44+n*2));const w=(o,s)=>[...s].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
for(let i=0;i<n;i++)b.setInt16(44+i*2,Math.sin(2*Math.PI*440*i/sr)*32767*0.5,true);return new Blob([b],{type:'audio/wav'});}
const a=document.getElementById('a');a.src=URL.createObjectURL(wav());a.volume=0.02;
const cv=document.getElementById('c'),g=cv.getContext('2d');let f=0;setInterval(()=>{g.fillStyle='hsl('+(f++*7%360)+',80%,50%)';g.fillRect(0,0,64,64)},50);
const v=document.getElementById('v');v.srcObject=cv.captureStream(20);
const v2=document.getElementById('v2');
window.start=async()=>{try{await a.play();await v.play();
 const ac=new AudioContext();const o=ac.createOscillator();const gn=ac.createGain();gn.gain.value=0.02;const d=ac.createMediaStreamDestination();o.connect(gn);gn.connect(d);o.start();
 v2.srcObject=new MediaStream([...cv.captureStream(20).getVideoTracks(),...d.stream.getAudioTracks()]);v2.volume=1;await v2.play();return 'started'}catch(e){return 'ERR '+e.name+' '+e.message}};
window.state=()=>JSON.stringify({audioT:+a.currentTime.toFixed(2),audioPaused:a.paused,videoT:+v.currentTime.toFixed(2),videoPaused:v.paused,video2T:+v2.currentTime.toFixed(2),video2Paused:v2.paused,vis:document.visibilityState});
</script>
